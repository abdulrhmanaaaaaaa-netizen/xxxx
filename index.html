<section id="authScreen" class="auth hidden">
  <div class="auth-orb oa"></div>
  <div class="auth-orb ob"></div>
  <div class="auth-orb oc"></div>
  <div class="auth-grid-bg"></div>
  <div class="auth-scan-line"></div>

  <div class="auth-card">
    <span class="corner c-tl"></span>
    <span class="corner c-tr"></span>
    <span class="corner c-bl"></span>
    <span class="corner c-br"></span>
    <span class="edge-glow"></span>

    <!-- Brand row -->
    <div class="auth-brand-row">
      <div class="auth-logo">
        <img src="https://up6.cc/2026/09/178886608408951.jpg" alt="">
      </div>
      <div class="auth-brand-name">
        <span class="brand-dot">◆</span>
        <strong>Remove<span>BG</span></strong>
      </div>
    </div>

    <!-- Welcome -->
    <div class="auth-welcome">
      <h1 id="formTitle">أهلًا بعودتك</h1>
      <p id="formSub">سجّل دخولك لمتابعة رحلتك الإبداعية</p>
    </div>

    <div class="auth-hr"></div>

    <!-- Form -->
    <form id="authForm" autocomplete="on" novalidate>

      <div class="field hidden" id="fUsername">
        <label>اسم المستخدم</label>
        <div class="input-wrap">
          <input id="username" type="text" maxlength="20" placeholder="username_123" autocomplete="username" spellcheck="false">
          <span class="input-icon right-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </span>
        </div>
        <span class="err" id="errUsername"></span>
      </div>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <div class="input-wrap">
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" spellcheck="false" required>
          <span class="input-icon right-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
          </span>
        </div>
        <span class="err" id="errEmail"></span>
      </div>

      <div class="field">
        <label>كلمة المرور</label>
        <div class="input-wrap">
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
          <button class="eye left-icon" id="eyePass" type="button" tabindex="-1" aria-label="عرض">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 12s4-7 10.5-7 10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <span class="input-icon right-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </span>
        </div>
        <div class="strength hidden" id="strength">
          <div class="bars" data-lvl="0"><i></i><i></i><i></i><i></i></div>
          <span id="strengthTxt">—</span>
        </div>
        <span class="err" id="errPassword"></span>
      </div>

      <div class="field hidden" id="fConfirm">
        <label>تأكيد كلمة المرور</label>
        <div class="input-wrap">
          <input id="confirm" type="password" placeholder="أعد الإدخال" autocomplete="new-password">
          <button class="eye left-icon" id="eyeConfirm" type="button" tabindex="-1" aria-label="عرض">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 12s4-7 10.5-7 10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <span class="input-icon right-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </span>
        </div>
        <span class="err" id="errConfirm"></span>
      </div>

      <ul class="reqs hidden" id="reqs">
        <li data-r="len"><i></i>8 أحرف على الأقل</li>
        <li data-r="num"><i></i>رقم واحد على الأقل</li>
        <li data-r="upper"><i></i>حرف كبير (A-Z)</li>
        <li data-r="match"><i></i>الكلمتان متطابقتان</li>
      </ul>

      <div class="row-between">
        <label class="check">
          <input type="checkbox" id="remember" checked>
          <span class="box"></span>
          <span>تذكرني</span>
        </label>
        <button type="button" class="link" id="forgotBtn">نسيت كلمة المرور؟</button>
      </div>

      <button type="submit" id="submitBtn" class="btn-main" disabled>
        <span class="btn-glow"></span>
        <span class="btn-text">تسجيل الدخول</span>
        <span class="btn-arrow">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
        </span>
      </button>
    </form>

    <div id="authMsg" class="msg"></div>

    <!-- Modern switch link (replaces old tabs) -->
    <div class="auth-switch">
      <span id="switchText">ليس لديك حساب؟</span>
      <button id="switchBtn" class="link-btn" type="button">أنشئ حساباً</button>
    </div>

    <div class="auth-foot">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/></svg>
      اتصال آمن · SSL 256-bit · Sandstorm Studio
    </div>
  </div>
  </section>
